<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JEE Exam Simulator</title>
    <style>
        :root {
            --bg: #0f172a; --panel: #1e293b; --text: #f8fafc;
            --accent: #3b82f6; --success: #10b981; --review: #8b5cf6; --danger: #ef4444;
        }
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header { height: 60px; background: #020617; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #334155; }
        .test-title { font-size: 1.1rem; font-weight: 600; color: #cbd5e1; }
        .timer { font-family: monospace; font-size: 1.4rem; color: #fbbf24; font-weight: bold; }
        .btn-top { background: #334155; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-left: 10px; }

        /* Workspace */
        .main-wrapper { display: flex; flex: 1; overflow: hidden; }
        .pdf-area { flex: 1; padding: 12px; display: flex; flex-direction: column; }
        #pdf-frame { width: 100%; height: 100%; border-radius: 8px; border: 1px solid #334155; background: #fff; }

        /* Sidebar UI */
        .sidebar { width: 380px; background: var(--panel); border-left: 1px solid #334155; display: flex; flex-direction: column; }
        .q-nav { padding: 20px; border-bottom: 1px solid #334155; }
        .q-label { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
        .options-box { display: flex; gap: 12px; margin-bottom: 20px; }
        .opt-btn { flex: 1; height: 50px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: white; font-weight: 600; cursor: pointer; }
        .opt-btn.selected { background: var(--accent); border-color: var(--accent); }

        .palette { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; align-content: start; }
        .q-node { height: 45px; display: flex; align-items: center; justify-content: center; background: #334155; border-radius: 6px; cursor: pointer; font-size: 0.9rem; border: 1px solid #475569; }
        .q-node.active { border: 2px solid white; transform: scale(1.05); }
        .q-node.ans { background: var(--success); }
        .q-node.rev { background: var(--review); }
    </style>
</head>
<body>

    <div class="header">
        <div class="test-title" id="test-title">Loading Exam...</div>
        <div>
            <button class="btn-top" onclick="togglePdf()">Toggle Solutions</button>
            <span class="timer" id="timer">03:00:00</span>
        </div>
    </div>

    <div class="main-wrapper">
        <div class="pdf-area">
            <iframe id="pdf-frame"></iframe>
        </div>
        <div class="sidebar">
            <div class="q-nav">
                <div class="q-label" id="current-q">Q. 1</div>
                <div class="options-box">
                    <button class="opt-btn" onclick="setOpt('A')">A</button>
                    <button class="opt-btn" onclick="setOpt('B')">B</button>
                    <button class="opt-btn" onclick="setOpt('C')">C</button>
                    <button class="opt-btn" onclick="setOpt('D')">D</button>
                </div>
                <input type="number" id="num-input" placeholder="Numerical Answer" style="width:100%; padding: 12px; border-radius: 8px; border:1px solid #475569; background:#0f172a; color:white;">
            </div>
            <div class="palette" id="palette"></div>
        </div>
    </div>

    <script>
        // Setup state
        const params = new URLSearchParams(window.location.search);
        const qUrl = params.get('qUrl'), aUrl = params.get('aUrl');
        document.getElementById('test-title').innerText = params.get('title');
        document.getElementById('pdf-frame').src = qUrl;
        
        let activeQ = 1, state = Array(91).fill(null).map(() => ({ans: null, status: 'unvisited'}));

        // Build Palette
        const pal = document.getElementById('palette');
        for(let i=1; i<=90; i++) {
            let div = document.createElement('div');
            div.className = 'q-node';
            div.id = `q-${i}`;
            div.innerText = i;
            div.onclick = () => jump(i);
            pal.appendChild(div);
        }

        function jump(i) {
            document.getElementById(`q-${activeQ}`).classList.remove('active');
            activeQ = i;
            document.getElementById(`q-${activeQ}`).classList.add('active');
            document.getElementById('current-q').innerText = `Q. ${i}`;
        }

        function setOpt(o) {
            state[activeQ].ans = o;
            state[activeQ].status = 'ans';
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.toggle('selected', b.innerText === o));
            document.getElementById(`q-${activeQ}`).className = 'q-node active ans';
        }

        function togglePdf() {
            let frame = document.getElementById('pdf-frame');
            frame.src = frame.src === qUrl ? aUrl : qUrl;
        }

        jump(1);
    </script>
</body>
</html>
