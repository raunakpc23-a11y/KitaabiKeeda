<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Simulator</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #3b82f6; --text: #f1f5f9; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* Top Header */
        .header { height: 60px; background: #020617; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #334155; z-index: 10; }
        .test-title { font-size: 1.1rem; font-weight: 600; }
        .controls-group { display: flex; gap: 12px; align-items: center; }
        
        .btn-action { background: #334155; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: 0.2s; text-decoration: none; display: inline-flex; align-items: center; }
        .btn-action:hover { background: #475569; }
        .timer { font-family: monospace; font-size: 1.3rem; font-weight: bold; color: #fbbf24; }

        /* Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .pdf-area { flex: 1; padding: 16px; display: flex; flex-direction: column; position: relative; background: #e9ecef; }
        #pdf-frame { flex: 1; width: 100%; border-radius: 12px; border: 1px solid #334155; background: white; display: none; }

        /* Coming Soon Fallback */
        #coming-soon { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border-radius: 12px; text-align: center; padding: 20px; }
        #coming-soon h2 { color: #475569; font-size: 2em; margin-bottom: 10px; }
        #coming-soon p { color: #94a3b8; font-size: 1.1em; }

        /* OMR Side Panel */
        .omr-panel { width: 360px; background: var(--panel); border-left: 1px solid #334155; display: flex; flex-direction: column; padding: 20px; }
        
        .q-label { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .opt-btn { height: 45px; border-radius: 8px; border: 1px solid #475569; background: #334155; color: white; font-weight: 600; cursor: pointer; }
        .opt-btn.active { background: var(--accent); border-color: var(--accent); }
        
        .nav-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: auto; overflow-y: auto; padding-right: 5px; }
        .q-node { height: 40px; display: flex; align-items: center; justify-content: center; background: #334155; border-radius: 6px; cursor: pointer; border: 1px solid #475569; font-size: 0.85rem; color: white; }
        .q-node.active { border: 2px solid white; transform: scale(1.05); }
        .q-node.ans { background: #10b981; }
        .q-node.rev { background: #8b5cf6; }

        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .btn-main { padding: 12px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div class="test-title" id="test-title">Loading Exam...</div>
        <div class="controls-group">
            <a id="popout" class="btn-action" target="_blank">Pop-out PDF</a>
            <button id="toggle-key-btn" class="btn-action" onclick="togglePdf()">Show Solutions</button>
            <div class="timer">03:00:00</div>
        </div>
    </div>

    <div class="workspace">
        <div class="pdf-area">
            <div id="coming-soon">
                <h2>🚧 COMING SOON</h2>
                <p id="missing-text">The file for this section is currently unassigned or missing.</p>
            </div>
            <iframe id="pdf-frame"></iframe>
        </div>
        <div class="omr-panel">
            <div class="q-label" id="current-q">Q. 1</div>
            <div class="btn-grid">
                <button class="opt-btn" onclick="setOpt('A')">A</button>
                <button class="opt-btn" onclick="setOpt('B')">B</button>
                <button class="opt-btn" onclick="setOpt('C')">C</button>
                <button class="opt-btn" onclick="setOpt('D')">D</button>
            </div>
            <div class="btn-row">
                <button class="btn-main" style="background:#10b981" onclick="save(true)">Save & Next</button>
                <button class="btn-main" style="background:#8b5cf6" onclick="save(false)">Review</button>
                <button class="btn-main" style="background:#dc3545; grid-column: span 2;" onclick="clearAns()">Clear</button>
            </div>
            <div class="nav-grid" id="palette"></div>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const qUrl = params.get('qUrl') || '';
        const aUrl = params.get('aUrl') || '';
        
        let isShowingKey = false;
        let activeQ = 1;
        let state = Array(91).fill(null).map(() => ({ans: null, status: 'unvisited'}));
        
        document.getElementById('test-title').innerText = params.get('title') || 'Mock Test';

        window.onload = function() {
            // Load initial view (Questions if available, otherwise Solutions)
            loadIframe(qUrl || aUrl);

            // Hide solution toggle button if we don't have both files
            if (!qUrl || !aUrl) {
                document.getElementById('toggle-key-btn').style.display = 'none';
            }

            // Build Palette
            const pal = document.getElementById('palette');
            for(let i=1; i<=90; i++) {
                let d = document.createElement('div');
                d.className = 'q-node'; 
                d.id = `q-${i}`; 
                d.innerText = i;
                d.onclick = () => jump(i);
                pal.appendChild(d);
            }
            jump(1);
        };

        function loadIframe(url) {
            const frame = document.getElementById('pdf-frame');
            const placeholder = document.getElementById('coming-soon');
            const popoutBtn = document.getElementById('popout');

            if (url && url.trim() !== '' && url !== 'null' && url !== 'undefined') {
                frame.src = url;
                frame.style.display = 'block';
                placeholder.style.display = 'none';
                popoutBtn.href = url;
                popoutBtn.style.display = 'inline-flex';
            } else {
                frame.src = '';
                frame.style.display = 'none';
                placeholder.style.display = 'flex';
                popoutBtn.style.display = 'none';
            }
        }

        function togglePdf() {
            isShowingKey = !isShowingKey;
            let targetUrl = isShowingKey ? aUrl : qUrl;
            
            loadIframe(targetUrl);
            
            document.getElementById('toggle-key-btn').innerText = isShowingKey ? "Back to Paper" : "Show Solutions";
            let msgType = isShowingKey ? "Solution Key" : "Question Paper";
            document.getElementById('missing-text').innerText = `The ${msgType} for this test is currently unassigned or missing.`;
        }

        function jump(i) {
            document.getElementById(`q-${activeQ}`).classList.remove('active');
            activeQ = i;
            document.getElementById(`q-${activeQ}`).classList.add('active');
            document.getElementById('current-q').innerText = `Q. ${i}`;
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.toggle('active', state[i].ans === b.innerText));
        }

        function setOpt(o) {
            state[activeQ].ans = o;
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.toggle('active', b.innerText === o));
        }

        function save(isAns) {
            state[activeQ].status = isAns ? 'ans' : 'rev';
            document.getElementById(`q-${activeQ}`).className = `q-node active ${isAns ? 'ans' : 'rev'}`;
            if(activeQ < 90) jump(activeQ + 1);
        }

        function clearAns() {
            state[activeQ] = {ans: null, status: 'unvisited'};
            document.getElementById(`q-${activeQ}`).className = 'q-node active';
            document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        }

        jump(1);
    </script>
</body>
</html>
