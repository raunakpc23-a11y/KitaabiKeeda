<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTA CBT Simulator</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { display: flex; height: 100vh; background-color: #f4f4f4; overflow: hidden; }

        /* Top Header */
        .header { position: absolute; top: 0; width: 100%; height: 50px; background: #007bff; color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-title { font-weight: bold; font-size: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50%; }
        .timer { font-size: 1.2em; font-weight: bold; font-family: monospace; background: #0056b3; padding: 5px 10px; border-radius: 4px; }
        
        .failsafe-btn { background: #ffc107; color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; text-decoration: none; font-size: 13px; margin-right: 10px; cursor: pointer; }
        .failsafe-btn:hover { background: #e0a800; }

        /* Main Workspace */
        .workspace { display: flex; width: 100%; margin-top: 50px; height: calc(100vh - 50px); }

        /* Left: PDF Viewer */
        .pdf-section { flex-grow: 1; display: flex; flex-direction: column; background: #fff; border-right: 2px solid #ccc; }
        iframe { flex-grow: 1; width: 100%; border: none; }

        /* Right: OMR & Palette */
        .omr-section { width: 340px; background: #eef2f5; display: flex; flex-direction: column; flex-shrink: 0; }
        
        /* Action Area (A, B, C, D) */
        .action-area { padding: 20px; background: #fff; border-bottom: 2px solid #ddd; }
        .question-label { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px; display: inline-block; }
        .options-grid { display: flex; gap: 10px; margin-bottom: 20px; }
        .option-btn { flex: 1; height: 45px; border: 2px solid #ccc; background: #fff; font-size: 1.2em; font-weight: bold; border-radius: 5px; cursor: pointer; transition: all 0.1s; }
        .option-btn:hover { background: #f0f0f0; }
        .option-btn.selected { background: #007bff; color: white; border-color: #0056b3; }

        /* Control Buttons */
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { padding: 10px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; color: white; text-align: center; }
        .btn-save { background: #28a745; }
        .btn-save:hover { background: #218838; }
        .btn-clear { background: #dc3545; }
        .btn-clear:hover { background: #c82333; }
        .btn-review { background: #17a2b8; grid-column: span 2; }

        /* Question Palette */
        .palette-area { flex-grow: 1; overflow-y: auto; padding: 15px; background: #fff; }
        .palette-title { font-size: 0.9em; font-weight: bold; margin-bottom: 10px; color: #555; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        
        .q-node { height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; background: #f8f9fa; color: #333; transition: transform 0.1s; }
        .q-node:hover { background: #e2e6ea; }
        .q-node.active { border: 2px solid #000; transform: scale(1.1); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        /* NTA Colors */
        .q-node.answered { background: #28a745; color: white; border-color: #218838; }
        .q-node.not-answered { background: #dc3545; color: white; border-color: #c82333; }
        .q-node.review { background: #6f42c1; color: white; border-color: #59339d; }
        .q-node.answered-review { background: #6f42c1; color: white; border-color: #59339d; position: relative; }
        .q-node.answered-review::after { content: "✓"; position: absolute; bottom: -5px; right: -5px; background: #28a745; border-radius: 50%; font-size: 10px; width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; }

    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="header">
        <div class="header-title" id="test-title">Loading...</div>
        <div>
            <a id="new-tab-btn" class="failsafe-btn" href="#" target="_blank">Pop Out PDF</a>
            <button id="toggle-key-btn" class="failsafe-btn" onclick="togglePdf()">Show Solutions</button>
            <span class="timer" id="timer">03:00:00</span>
        </div>
    </div>

    <div class="workspace">
        <!-- Left: Paper -->
        <div class="pdf-section">
            <iframe id="pdf-frame" src=""></iframe>
        </div>

        <!-- Right: OMR Panel -->
        <div class="omr-section">
            
            <div class="action-area">
                <div class="question-label" id="current-q-label">Question 1</div>
                
                <div class="options-grid" id="options-container">
                    <button class="option-btn" onclick="selectOption('A')">A</button>
                    <button class="option-btn" onclick="selectOption('B')">B</button>
                    <button class="option-btn" onclick="selectOption('C')">C</button>
                    <button class="option-btn" onclick="selectOption('D')">D</button>
                </div>

                <div class="controls">
                    <button class="btn btn-save" onclick="saveNext()">Save & Next</button>
                    <button class="btn btn-clear" onclick="clearResponse()">Clear</button>
                    <button class="btn btn-review" onclick="markReview()">Mark for Review & Next</button>
                </div>
            </div>

            <div class="palette-area">
                <div class="palette-title">Question Palette:</div>
                <div class="grid" id="palette">
                    <!-- Javascript generates buttons here -->
                </div>
            </div>

        </div>
    </div>

    <script>
        // 1. Grab URLs from index.html
        const urlParams = new URLSearchParams(window.location.search);
        const qUrl = urlParams.get('qUrl') || '';
        const aUrl = urlParams.get('aUrl') || '';
        document.getElementById('test-title').innerText = urlParams.get('title') || 'Mock Test';

        let isShowingKey = false;
        let activeQ = 1;
        const totalQ = 90; // Standard JEE Length
        let userAnswers = {}; // Stores { questionNumber: 'A', status: 'answered' }

        // Initialize PDF
        window.onload = function() {
            const pdfFrame = document.getElementById('pdf-frame');
            const newTabBtn = document.getElementById('new-tab-btn');
            const toggleBtn = document.getElementById('toggle-key-btn');

            let initialSrc = qUrl || aUrl;
            pdfFrame.src = initialSrc;
            newTabBtn.href = initialSrc;

            if(qUrl && aUrl) {
                toggleBtn.style.display = 'inline-block';
            } else {
                toggleBtn.style.display = 'none';
            }

            buildPalette();
            goToQuestion(1);
        };

        function togglePdf() {
            const pdfFrame = document.getElementById('pdf-frame');
            const toggleBtn = document.getElementById('toggle-key-btn');
            const newTabBtn = document.getElementById('new-tab-btn');

            isShowingKey = !isShowingKey;
            let targetUrl = isShowingKey ? aUrl : qUrl;
            
            pdfFrame.src = targetUrl;
            newTabBtn.href = targetUrl;
            toggleBtn.innerText = isShowingKey ? "Back to Paper" : "Show Solutions";
        }

        // --- OMR ENGINE ---

        function buildPalette() {
            const palette = document.getElementById('palette');
            for(let i = 1; i <= totalQ; i++) {
                userAnswers[i] = { option: null, status: 'unvisited' };
                let btn = document.createElement('div');
                btn.className = 'q-node';
                btn.id = `qbtn-${i}`;
                btn.innerText = i;
                btn.onclick = () => goToQuestion(i);
                palette.appendChild(btn);
            }
        }

        function goToQuestion(num) {
            // Mark previous as 'not-answered' if it was merely visited
            if(userAnswers[activeQ].status === 'unvisited') {
                userAnswers[activeQ].status = 'not-answered';
                updateNodeUI(activeQ);
            }

            // Remove active state from old
            document.getElementById(`qbtn-${activeQ}`).classList.remove('active');
            
            // Set new active
            activeQ = num;
            document.getElementById(`qbtn-${activeQ}`).classList.add('active');
            document.getElementById('current-q-label').innerText = `Question ${num}`;

            // Restore options UI for this question
            const currentSelected = userAnswers[activeQ].option;
            document.querySelectorAll('.option-btn').forEach(btn => {
                if(btn.innerText === currentSelected) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        }

        function selectOption(opt) {
            userAnswers[activeQ].option = opt;
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.innerText === opt) btn.classList.add('selected');
            });
        }

        function clearResponse() {
            userAnswers[activeQ].option = null;
            userAnswers[activeQ].status = 'not-answered';
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            updateNodeUI(activeQ);
        }

        function saveNext() {
            if(userAnswers[activeQ].option) {
                userAnswers[activeQ].status = 'answered';
            } else {
                userAnswers[activeQ].status = 'not-answered';
            }
            updateNodeUI(activeQ);
            if(activeQ < totalQ) goToQuestion(activeQ + 1);
        }

        function markReview() {
            if(userAnswers[activeQ].option) {
                userAnswers[activeQ].status = 'answered-review';
            } else {
                userAnswers[activeQ].status = 'review';
            }
            updateNodeUI(activeQ);
            if(activeQ < totalQ) goToQuestion(activeQ + 1);
        }

        function updateNodeUI(num) {
            let node = document.getElementById(`qbtn-${num}`);
            node.className = `q-node active ${userAnswers[num].status}`;
        }
    </script>
</body>
</html>
