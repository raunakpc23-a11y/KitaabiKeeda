<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTA CBT Simulator</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; display: flex; height: 100vh; background-color: #f4f6f8; }
        
        /* Left Sidebar: Folder Tree */
        #sidebar { width: 250px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; padding: 10px; }
        .folder-tree ul { list-style-type: none; padding-left: 15px; margin: 5px 0; }
        .folder { cursor: pointer; font-weight: bold; margin-top: 8px; user-select: none; color: #333; }
        .file { cursor: pointer; padding-left: 20px; color: #0056b3; margin-top: 5px; font-size: 14px; }
        .file:hover { text-decoration: underline; background: #f0f8ff; }
        .hidden { display: none; }
        
        /* Center: PDF Viewer */
        #main-panel { flex-grow: 1; display: flex; flex-direction: column; }
        #top-bar { height: 50px; background: #007bff; color: white; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        #pdf-frame { flex-grow: 1; width: 100%; border: none; }
        .toggle-btn { background: #ffc107; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; display: none; }
        
        /* Right Sidebar: CBT OMR Palette */
        #cbt-panel { width: 300px; background: #fff; border-left: 1px solid #ddd; display: flex; flex-direction: column; }
        .cbt-header { padding: 15px; background: #e9ecef; text-align: center; font-weight: bold; border-bottom: 1px solid #ddd; }
        #question-palette { flex-grow: 1; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; align-content: start; }
        .q-btn { padding: 10px; text-align: center; background: #e0e0e0; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; }
        .q-btn.answered { background: #28a745; color: white; border-color: #28a745; }
        .q-btn.review { background: #17a2b8; color: white; border-color: #17a2b8; }
        
        #action-bar { padding: 15px; border-top: 1px solid #ddd; background: #f8f9fa; display: flex; justify-content: space-between; }
        .btn { padding: 8px 12px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
        .btn-save { background: #28a745; color: white; }
        .btn-review { background: #17a2b8; color: white; }
    </style>
</head>
<body>

    <!-- Left: Folder Tree -->
    <div id="sidebar">
        <h3 style="margin-top: 0;">Test Library</h3>
        <div id="folder-tree"></div>
    </div>

    <!-- Center: Test Viewer -->
    <div id="main-panel">
        <div id="top-bar">
            <h3 id="test-title">Select a test from the library</h3>
            <div>
                <span id="timer" style="margin-right: 20px; font-size: 18px; font-weight: bold;">03:00:00</span>
                <button id="toggle-key-btn" class="toggle-btn" onclick="togglePdf()">Show Answer Key</button>
            </div>
        </div>
        <iframe id="pdf-frame" src=""></iframe>
    </div>

    <!-- Right: Digital OMR -->
    <div id="cbt-panel">
        <div class="cbt-header">Question Palette</div>
        <div id="question-palette">
            <!-- Buttons generated by JS -->
        </div>
        <div id="action-bar">
            <button class="btn btn-review" onclick="markReview()">Mark Review</button>
            <button class="btn btn-save" onclick="saveAnswer()">Save & Next</button>
        </div>
    </div>

    <!-- Load your data file -->
    <script>
// Hardcoded test data to check if the layout works
const mockTests = [
  {
    "title": "Test Paper Works!",
    "folders": ["SIMULATOR", "Test Folder"],
    "questionUrl": "https://drive.google.com/file/d/1WOmj7oH2IOvToZx-lM5N9JaOHC0B--iF/preview",
    "answerKeyUrl": ""
  }
];
</script>

    <script>
        let currentTest = null;
        let isShowingKey = false;
        let activeQuestion = 1;

        // 1. Build the Folder Tree
        function buildFolderTree(data) {
            const tree = {};
            data.forEach(item => {
                let current = tree;
                item.folders.forEach(folder => {
                    if (!current[folder]) current[folder] = { _files: [] };
                    current = current[folder];
                });
                current._files.push(item);
            });
            return tree;
        }

        function renderTree(node, container) {
            const ul = document.createElement('ul');
            ul.className = "folder-tree";
            
            for (const key in node) {
                if (key === '_files') {
                    node[key].forEach(file => {
                        const li = document.createElement('li');
                        li.className = 'file';
                        li.innerHTML = `📄 ${file.title || "Combined Paper"}`;
                        li.onclick = (e) => {
                            e.stopPropagation();
                            loadTest(file);
                        };
                        ul.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.className = 'folder';
                    li.innerHTML = `📁 ${key}`;
                    const childContainer = document.createElement('div');
                    childContainer.className = 'hidden';
                    renderTree(node[key], childContainer);
                    
                    li.onclick = (e) => {
                        e.stopPropagation();
                        childContainer.classList.toggle('hidden');
                        li.innerHTML = childContainer.classList.contains('hidden') ? `📁 ${key}` : `📂 ${key}`;
                    };
                    ul.appendChild(li);
                    ul.appendChild(childContainer);
                }
            }
            container.appendChild(ul);
        }

        // Initialize Folder Tree
        const treeContainer = document.getElementById('folder-tree');
        renderTree(buildFolderTree(mockTests), treeContainer);

        // 2. Load the Test into the Iframe
        function loadTest(test) {
            currentTest = test;
            isShowingKey = false;
            document.getElementById('test-title').innerText = test.title || "Mock Test";
            
            const pdfFrame = document.getElementById('pdf-frame');
            const toggleBtn = document.getElementById('toggle-key-btn');

            // Handle Combined vs Separate Files logic
            if (test.questionUrl !== "" && test.answerKeyUrl !== "") {
                // Separate files: Load question, show toggle button
                pdfFrame.src = test.questionUrl;
                toggleBtn.style.display = "block";
                toggleBtn.innerText = "Show Answer Key";
            } else if (test.questionUrl !== "") {
                // Only questions exist
                pdfFrame.src = test.questionUrl;
                toggleBtn.style.display = "none";
            } else if (test.answerKeyUrl !== "") {
                // Combined file (questionUrl is empty, but answerKey exists)
                pdfFrame.src = test.answerKeyUrl;
                toggleBtn.style.display = "none"; // No need to toggle, everything is in one PDF
            }

            // Reset Palette
            generatePalette(75); // Standard JEE Main length
        }

        // 3. Toggle between Question and Answer Key (If split files)
        function togglePdf() {
            if (!currentTest) return;
            const pdfFrame = document.getElementById('pdf-frame');
            const toggleBtn = document.getElementById('toggle-key-btn');

            if (isShowingKey) {
                pdfFrame.src = currentTest.questionUrl;
                toggleBtn.innerText = "Show Answer Key";
            } else {
                pdfFrame.src = currentTest.answerKeyUrl;
                toggleBtn.innerText = "Back to Questions";
            }
            isShowingKey = !isShowingKey;
        }

        // 4. Generate CBT Question Palette
        function generatePalette(totalQuestions) {
            const palette = document.getElementById('question-palette');
            palette.innerHTML = "";
            for (let i = 1; i <= totalQuestions; i++) {
                const btn = document.createElement('div');
                btn.className = 'q-btn';
                btn.id = `qbtn-${i}`;
                btn.innerText = i;
                btn.onclick = () => setActiveQuestion(i);
                palette.appendChild(btn);
            }
            setActiveQuestion(1);
        }

        function setActiveQuestion(num) {
            if(document.getElementById(`qbtn-${activeQuestion}`)) {
                document.getElementById(`qbtn-${activeQuestion}`).style.border = "1px solid #ccc";
            }
            activeQuestion = num;
            document.getElementById(`qbtn-${activeQuestion}`).style.border = "2px solid #000";
        }

        function saveAnswer() {
            document.getElementById(`qbtn-${activeQuestion}`).className = 'q-btn answered';
            if(activeQuestion < 75) setActiveQuestion(activeQuestion + 1);
        }

        function markReview() {
            document.getElementById(`qbtn-${activeQuestion}`).className = 'q-btn review';
            if(activeQuestion < 75) setActiveQuestion(activeQuestion + 1);
        }
    </script>
</body>
</html>
